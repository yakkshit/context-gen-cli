name: CI & Multi-Registry Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test-node-cli:
    name: Test Node.js CLI (`ctx`) & EGRD Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Node test suite
        run: npm test

      - name: Test `ctx` CLI binary linking
        run: |
          npm link
          ctx --version
          ctx distill "update mcp tools and scanner graph in src"
          ctx --help

  test-python-cli:
    name: Test Python CLI (`ctx`) & PyPI Wheel Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and verify Python package & `ctx` command
        working-directory: python
        run: |
          python -m pip install --upgrade pip build wheel
          pip install -e .
          ctx --help
          python -m context_gen.cli --help
          python tests/verify_scanner_graph.py
          python -m build

  test-dart-package:
    name: Verify Dart Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Verify Dart CLI
        working-directory: dart
        run: |
          dart pub get
          dart run bin/ctx.dart --help
          dart pub publish --dry-run || true

  build-website:
    name: Build Showcase & Documentation Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build Next.js site
        working-directory: website
        run: |
          bun install
          bun run build

  publish-release:
    name: Publish to npm, PyPI & Sync Homebrew Formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-node-cli, test-python-cli, test-dart-package, build-website]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js for npm release
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python for PyPI release
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci || npm install
          npm publish --access public

      - name: Publish to PyPI
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist/ build/ *.egg-info
          python -m build
          twine upload dist/*

      - name: Resilient Homebrew Formula SHA256 Sync
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL_URL="https://registry.npmjs.org/context-gen-cli/-/context-gen-cli-${VERSION}.tgz"

          # Poll npm registry CDN until tarball is 200 OK
          SHA256=""
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /tmp/pkg.tgz -w "%{http_code}" "$TARBALL_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              SHA256=$(sha256sum /tmp/pkg.tgz | awk '{print $1}')
              echo "Tarball ready. SHA256: $SHA256"
              break
            fi
            echo "Waiting for npm CDN propagation (attempt $i/12)..."
            sleep 5
          done

          if [ -z "$SHA256" ]; then
            echo "Error: Could not retrieve npm tarball after 60 seconds."
            exit 1
          fi

          sed -i "s|url \".*\"|url \"$TARBALL_URL\"|" Formula/context-gen-cli.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" Formula/context-gen-cli.rb
          sed -i "s|assert_match \".*\"|assert_match \"$VERSION\"|" Formula/context-gen-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/context-gen-cli.rb
          git commit -m "chore(formula): update sha256 for v${VERSION} [skip ci]" || exit 0
          git push origin main
