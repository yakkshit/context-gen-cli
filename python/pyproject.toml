[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-gen-cli"
version = "1.3.8"
description = "A modern CLI tool that scans any project, builds an AST-based dependency graph, and generates structured LLM context (agent.md / agent.json)."
readme = "README.md"
authors = [{ name = "yakkshit" }]
license = "MIT"
requires-python = ">=3.9"
keywords = ["llm", "context", "agent", "cli", "code-analysis", "ast", "graph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "shellingham>=1.5.4",
    "pathspec>=0.12.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.1.0",
    "twine>=5.0.0"
]

[project.scripts]
context-gen = "context_gen.cli:app"
ctx = "context_gen.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_gen*"]
